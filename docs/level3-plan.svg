<text x="50" y="1060" font-size="17" font-weight="bold">Обозначения</text>
<rect x="50" y="1068" width="18" height="18" fill="#b7a48a" stroke="#0004"/><text x="76" y="1082" font-size="14">Q — Карьер — уступы вниз</text>
<rect x="510" y="1068" width="18" height="18" fill="#a89a80" stroke="#0004"/><text x="536" y="1082" font-size="14">D — Отвалы породы</text>
<rect x="50" y="1092" width="18" height="18" fill="#c9b99a" stroke="#0004"/><text x="76" y="1106" font-size="14">h — Технологическая дорога, пандус</text>
<rect x="510" y="1092" width="18" height="18" fill="#8a8f96" stroke="#0004"/><text x="536" y="1106" font-size="14">C — Дробильно-сортировочный завод</text>
<rect x="50" y="1116" width="18" height="18" fill="#7d8288" stroke="#0004"/><text x="76" y="1130" font-size="14">G — Гараж самосвалов, мастерские</text>
<rect x="510" y="1116" width="18" height="18" fill="#9a9a8a" stroke="#0004"/><text x="536" y="1130" font-size="14">W — Контора рудоуправления</text>
<rect x="50" y="1140" width="18" height="18" fill="#b0b08a" stroke="#0004"/><text x="76" y="1154" font-size="14">E — Подстанция</text>
<rect x="510" y="1140" width="18" height="18" fill="#c8b8a0" stroke="#0004"/><text x="536" y="1154" font-size="14">P — Посёлок горняков</text>
<rect x="50" y="1164" width="18" height="18" fill="#c8a878" stroke="#0004"/><text x="76" y="1178" font-size="14">S — Станция «Гранитная»</text>
<rect x="510" y="1164" width="18" height="18" fill="#9a8e7e" stroke="#0004"/><text x="536" y="1178" font-size="14">R — Сортировочная горка, вагоны</text>
<rect x="50" y="1188" width="18" height="18" fill="#8fb0b8" stroke="#0004"/><text x="76" y="1202" font-size="14">T — Хвостохранилище (вода, вязко)</text>
<rect x="510" y="1188" width="18" height="18" fill="#c86a5a" stroke="#0004"/><text x="536" y="1202" font-size="14">X — Склад взрывчатки (за забором)</text>
<rect x="50" y="1212" width="18" height="18" fill="#7a9a6a" stroke="#0004"/><text x="76" y="1226" font-size="14">F — Перелески, пустырь</text>
<text x="50" y="1270" font-size="14" fill="#2a2418">Лор: газ дошёл до карьера. Заражённые свозят обломки Объекта на дно — там собирают нового.</text>
<text x="50" y="1292" font-size="14" fill="#2a2418">Новые враги (на выбор): подрывники с толом — бегут и взрываются; самосвал-гигант — давит, его не сбить</text>
<text x="50" y="1314" font-size="14" fill="#2a2418">быстро; шагающий экскаватор — мини-босс на уступах.</text>
<text x="50" y="1336" font-size="14" fill="#2a2418">Препятствия: конвейерные галереи (высокие — облетать), опоры ЛЭП подстанции.</text>
<text x="50" y="1358" font-size="14" fill="#2a2418">Склад взрывчатки: подстрелить — огромный взрыв, сносит толпу у забора (и вертолёт, если рядом).</text>
<text x="50" y="1380" font-size="14" fill="#2a2418">Карьер: враги спускаются только по пандусу — вертолёт над ямой в относительной безопасности.</text>
<text x="50" y="1402" font-size="14" fill="#2a2418">Хвостохранилище — вязкая вода, враги в ней медленные. Поезд идёт по ветке на север, мимо горки.</text>
</svg>